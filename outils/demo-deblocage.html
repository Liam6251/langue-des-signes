<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Démo déblocage</title>
  <!-- Démo seule (rien n'est branché dans le site) : à quoi ressemblerait le bouton « Débloquer » d'un personnage secret.
       Ouvre outils/demo-deblocage.html avec le serveur local et clique sur « Débloquer ». ?video = clic automatique (pour l'enregistrement). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    html, body.demo { height: 100%; overflow: hidden; }
    body.demo {
      margin: 0; color: #fff; font-family: var(--f-texte);
      background: radial-gradient(90% 60% at 50% 42%, #2A0712, #0A0309 62%, #050205);
    }
    .demo .d-fond { position: fixed; inset: -20px; background: url(../assets/fond-fuji-sakura.jpg) center / cover; opacity: .16; filter: blur(3px) saturate(.7); }
    .demo .d-voile { position: fixed; inset: 0; background: radial-gradient(60% 45% at 50% 44%, transparent, rgba(0, 0, 0, .85)); opacity: 0; pointer-events: none; z-index: 3; }

    .d-scene { position: relative; z-index: 2; height: 100%; display: grid; grid-template-rows: 150px 1fr; justify-items: center; padding-top: 34px; box-sizing: border-box; }
    .entete { text-align: center; display: grid; align-content: center; gap: 6px; }
    .sur { margin: 0; font: 700 15px/1 var(--f-texte); letter-spacing: .26em; text-transform: uppercase; color: #FF9AA3; opacity: .8; }
    .titre { margin: 0; height: 74px; font: 800 66px/1.1 var(--f-titre); letter-spacing: -.01em; }
    .titre span { display: inline-block; background: linear-gradient(180deg, #FFFFFF 10%, #FFC2C7 55%, #FF3A4E); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 18px rgba(255, 50, 70, .75)); }
    .titre .esp { width: .28em; }

    .zone { position: relative; width: 100%; display: flex; justify-content: center; align-items: flex-start; }
    .rayons {
      position: absolute; left: 50%; top: 300px; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; border-radius: 50%; pointer-events: none;
      background: repeating-conic-gradient(from 0deg, transparent 0deg 6deg, rgba(255, 80, 95, .22) 6deg 10deg, transparent 10deg 15deg, rgba(255, 170, 110, .12) 15deg 17deg, transparent 17deg 22deg);
      -webkit-mask: radial-gradient(closest-side, #000 14%, transparent 70%); mask: radial-gradient(closest-side, #000 14%, transparent 70%);
      opacity: 0; animation: tourne 30s linear infinite;
    }
    .halo { position: absolute; left: 50%; top: 300px; width: 760px; height: 760px; margin: -380px 0 0 -380px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(closest-side, rgba(255, 40, 60, .55), rgba(255, 40, 60, .12) 55%, transparent); opacity: .22; }
    @keyframes tourne { to { rotate: 360deg; } }

    .flotte { position: relative; z-index: 2; perspective: 1500px; }
    .flotte.vole { animation: flotte 4.2s ease-in-out infinite; }
    @keyframes flotte { 0%, 100% { translate: 0 0; rotate: 0deg; } 50% { translate: 0 -12px; rotate: .6deg; } }

    /* la carte, en grand */
    .demo .perso-carte { width: 330px; box-sizing: border-box; padding: 18px 18px 22px; gap: 12px; border-radius: 30px; border-width: 2px; cursor: default; transform-origin: 50% 50%; }
    .demo .perso-portrait { border-radius: 22px; }
    .demo .perso-nom { font-size: 36px; line-height: 1.1; min-height: 40px; }
    .demo .perso-rarete { font-size: 17px; padding: 6px 16px; border-radius: 14px; top: -16px; right: -14px; }
    .demo .perso-xp { font-size: 20px; margin-top: -6px; }
    .demo .perso-xp b { font-weight: 800; }
    .demo .perso-jauge { height: 12px; position: relative; }
    .demo .perso-jauge > span { position: relative; overflow: hidden; }
    .demo .perso-jauge > span::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .75) 50%, transparent 70%); animation: balaye 1.8s ease-in-out infinite; }
    @keyframes balaye { from { translate: -100% 0; } to { translate: 100% 0; } }
    .demo .perso-cadenas { width: 76px; height: 76px; top: 36%; border-width: 2px; }
    .demo .perso-cadenas svg { width: 38px; height: 38px; overflow: visible; }
    .demo .perso-carte.verrouille .perso-aura { display: none; }
    .demo .perso-aura i { width: 7px; height: 7px; }

    /* XP atteint : la carte « appelle » le clic */
    .demo .perso-carte.verrouille.pret { border-color: rgba(255, 60, 75, .75); animation: pret 1.6s ease-in-out infinite; }
    @keyframes pret { 0%, 100% { box-shadow: 0 5px 0 #000, 0 0 16px -6px #FF2A3D; } 50% { box-shadow: 0 5px 0 #000, 0 0 46px 2px #FF2A3D; } }
    .demo .verrouille.pret .perso-cadenas { animation: cadenas 1.6s ease-in-out infinite; }
    @keyframes cadenas { 0%, 100% { scale: 1; box-shadow: 0 0 16px -4px #FF2A3D; } 50% { scale: 1.07; box-shadow: 0 0 34px 2px #FF2A3D; } }

    /* bouton Débloquer */
    .btn-deb {
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 58px; border-radius: 18px;
      font: 800 23px/1 var(--f-titre); letter-spacing: .01em; color: #fff; text-shadow: 0 2px 0 rgba(90, 0, 15, .5);
      background: linear-gradient(180deg, #FF6B78, #E01530 58%, #A80B22);
      box-shadow: 0 5px 0 #5E0410, inset 0 0 0 1.5px rgba(255, 190, 195, .55), 0 0 30px -4px #FF2A3D;
      animation: btn-pouls 1.6s ease-in-out infinite; transition: filter .2s, translate .2s;
    }
    .btn-deb svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .btn-deb::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%); translate: -120% 0; animation: reflet-btn 2.4s ease-in-out infinite; }
    .btn-deb.survol { filter: brightness(1.15); translate: 0 -3px; }
    @keyframes btn-pouls { 0%, 100% { box-shadow: 0 5px 0 #5E0410, inset 0 0 0 1.5px rgba(255, 190, 195, .55), 0 0 22px -6px #FF2A3D; } 50% { box-shadow: 0 5px 0 #5E0410, inset 0 0 0 1.5px rgba(255, 190, 195, .55), 0 0 40px 2px #FF2A3D; } }
    @keyframes reflet-btn { 0%, 45% { translate: -120% 0; } 85%, 100% { translate: 120% 0; } }
    .onde-btn { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: rgba(255, 255, 255, .6); pointer-events: none; }

    .btn-choisir {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 58px; border-radius: 18px;
      font: 800 23px/1 var(--f-titre); color: #7A0614; background: linear-gradient(180deg, #FFFFFF, #FFD3D7);
      box-shadow: 0 5px 0 #A80B22, 0 0 34px -4px #FF2A3D;
    }
    .btn-choisir svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

    /* effets posés sur la carte */
    .flash, .reflet { position: absolute !important; inset: 0; border-radius: inherit; pointer-events: none; z-index: 5 !important; }
    .flash { background: radial-gradient(70% 55% at 50% 36%, #fff, rgba(255, 210, 215, .85) 45%, rgba(255, 60, 80, .35)); opacity: 0; }
    .reflet { overflow: hidden; }
    .reflet::before { content: ""; position: absolute; top: -20%; bottom: -20%; width: 45%; left: 0; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .7), transparent); transform: skewX(-18deg) translateX(-160%); }
    .reflet.go::before { animation: reflet 0.9s cubic-bezier(.4, 0, .2, 1) forwards; }
    @keyframes reflet { to { transform: skewX(-18deg) translateX(330%); } }

    /* éclats, ondes, flash d'écran (au-dessus de tout) */
    #couche { position: fixed; inset: 0; pointer-events: none; z-index: 6; }
    .eclat { position: absolute; background: linear-gradient(140deg, #FFFFFF, #FF9AA3 45%, #FF2A3D); filter: drop-shadow(0 0 6px #FF2A3D); }
    .d-onde { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 4px solid #FFD6DA; box-shadow: 0 0 24px #FF2A3D, inset 0 0 18px #FF2A3D; }
    .flash-ecran { position: fixed; inset: 0; background: radial-gradient(55% 45% at 50% 44%, rgba(255, 255, 255, .95), rgba(255, 80, 100, .35) 60%, transparent); opacity: 0; pointer-events: none; z-index: 7; }
    #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; }

    /* faux curseur (pour la vidéo) */
    .curseur { position: fixed; left: 0; top: 0; width: 34px; height: 34px; z-index: 20; pointer-events: none; opacity: 0; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .6)); }
    .curseur svg { width: 100%; height: 100%; display: block; }
    .clic { position: fixed; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid #fff; z-index: 19; pointer-events: none; }
  </style>
</head>
<body class="demo">
  <div class="d-fond"></div>
  <div class="d-voile" id="voile"></div>

  <main class="d-scene" id="scene">
    <header class="entete">
      <p class="sur" id="sur">Personnage secret · 500 XP atteints</p>
      <h1 class="titre" id="titre"></h1>
    </header>
    <div class="zone">
      <div class="rayons" id="rayons"></div>
      <div class="halo" id="halo"></div>
      <div class="flotte" id="flotte">
        <div class="perso-carte r-secret verrouille pret" id="carte">
          <span class="perso-aura" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="perso-portrait" id="portrait" aria-hidden="true"></span>
          <span class="perso-cadenas" id="cadenas" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path id="anse" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
          <span class="perso-nom" id="nom">???</span>
          <span class="perso-xp" id="xp"><b>500</b> / 500 XP</span>
          <span class="jauge perso-jauge" id="jauge"><span style="width:100%"></span></span>
          <button type="button" class="btn-deb" id="deb"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 7.6-1.8"/></svg>Débloquer</button>
          <span class="perso-rarete" id="badge">Secret</span>
          <span class="flash" id="flash"></span>
          <span class="reflet" id="reflet"></span>
        </div>
      </div>
    </div>
  </main>

  <div id="couche"></div>
  <div class="flash-ecran" id="flashEcran"></div>
  <canvas id="fx"></canvas>
  <div class="curseur" id="curseur"><svg viewBox="0 0 24 24"><path d="M3 2L3 19.5L7.6 15.4L10.6 22L13.6 20.7L10.7 14.2L17 14.2Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>

  <script src="../js/moteur/mains.js"></script>
  <script src="../js/moteur/corps.js"></script>
  <script src="../js/moteur/lecteur.js"></script>
  <script src="../js/lsf.js"></script>
  <script src="../js/contenu.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/ui.js"></script>
  <script>
  (function () {
    'use strict';
    const $ = (s) => document.querySelector(s);
    // ?video : horloge contrôlée par l'enregistreur (window.__pas avance tout de dt ms : minuteurs, animations, particules),
    // pour une vidéo parfaitement fluide quelle que soit la vitesse de l'ordinateur. Sans ?video : temps réel normal.
    const VIDEO = /[?&]video/.test(location.search);
    let vt = 0; const minuteurs = [];
    const maintenant = () => (VIDEO ? vt : performance.now());
    const dormir = (ms) => new Promise((r) => (VIDEO ? minuteurs.push({ at: vt + ms, r }) : setTimeout(r, ms)));
    const ensuite = (f) => (VIDEO ? dormir(16).then(() => f(maintenant())) : requestAnimationFrame(f));
    const ID = 'alysa';
    const P = window.LSFStore.PERSOS[ID];
    const carte = $('#carte'), portrait = $('#portrait'), cadenas = $('#cadenas'), deb = $('#deb');
    window.LSFUI.portraitPerso(portrait, P);

    /* ---------- particules (canvas) ---------- */
    const cv = $('#fx'), cx = cv.getContext('2d');
    let W = 0, H = 0;
    function taille() { const d = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); }
    taille(); addEventListener('resize', taille);
    const COUL = ['#FF2A3D', '#FF6B78', '#FF9AA3', '#FFB36B', '#FFE3A0', '#FFFFFF'];
    const CONF = ['#FF2A3D', '#FF9AA3', '#FFFFFF', '#FFC94A', '#FF7A45', '#C9D3FF'];
    const hasard = (a, b) => a + Math.random() * (b - a);
    const choix = (l) => l[Math.random() * l.length | 0];
    const parts = [];
    let cible = null, aspirer = false, braises = false;
    // la simulation avance par pas de 1/60 s, quel que soit le rythme d'affichage (même vitesse à 30, 60 ou 120 images/s)
    let dernier = 0;
    function boucle(maintenant) {
      const n = dernier ? Math.max(1, Math.min(6, Math.round((maintenant - dernier) / 16.667))) : 1;
      if (!dernier || maintenant - dernier >= 8) { for (let k = 0; k < n; k++) avancer(k === n - 1); dernier = maintenant; }
      requestAnimationFrame(boucle);
    }
    function avancer(dessin) {
      if (dessin) cx.clearRect(0, 0, W, H);
      if (aspirer && cible) for (let k = 0; k < 5; k++) {
        const a = Math.random() * Math.PI * 2, r = hasard(200, 420);
        parts.push({ t: 'aspire', x: cible.x + Math.cos(a) * r, y: cible.y + Math.sin(a) * r, vx: -Math.sin(a) * 3, vy: Math.cos(a) * 3, vie: 0, max: 140, s: hasard(1.6, 3.2), tr: 3, c: choix(COUL) });
      }
      if (braises) {
        const r = carte.getBoundingClientRect();
        // braises seulement sur les côtés de la carte (pas devant le visage), couleurs chaudes
        const gauche = Math.random() < 0.5;
        if (Math.random() < 0.6) parts.push({ t: 'braise', x: gauche ? hasard(r.left - 90, r.left + 6) : hasard(r.right - 6, r.right + 90), y: hasard(r.top + r.height * 0.3, r.bottom + 20), vx: hasard(-0.25, 0.25), vy: hasard(-1.7, -0.6), drag: 1, g: -0.006, vie: 0, max: hasard(90, 170), s: hasard(1.8, 3.4), tr: 5, c: choix(['#FF2A3D', '#FF6B78', '#FFB36B', '#FFE3A0']) });
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]; p.vie++;
        if (p.t === 'aspire') {
          const dx = cible.x - p.x, dy = cible.y - p.y, d = Math.hypot(dx, dy) || 1;
          p.vx = (p.vx + (dx / d) * 1.3) * 0.92; p.vy = (p.vy + (dy / d) * 1.3) * 0.92;
          if (d < 16) { parts.splice(i, 1); continue; }
        } else { p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; }
        const ox = p.x, oy = p.y; p.x += p.vx; p.y += p.vy;
        const a = 1 - p.vie / p.max;
        if (a <= 0 || p.y > H + 40) { parts.splice(i, 1); continue; }
        if (p.t === 'confetti') p.rot += p.vr;
        if (!dessin) continue;
        if (p.t === 'confetti') {
          cx.save(); cx.globalAlpha = Math.min(1, a * 2); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.scale(1, Math.cos(p.vie * p.fl));
          cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore();
        } else {
          cx.globalCompositeOperation = 'lighter';
          cx.globalAlpha = p.t === 'aspire' ? Math.min(1, p.vie / 10) : a;
          cx.strokeStyle = p.c; cx.lineWidth = p.s; cx.lineCap = 'round';
          cx.beginPath(); cx.moveTo(ox - p.vx * p.tr, oy - p.vy * p.tr); cx.lineTo(p.x, p.y); cx.stroke();
          if (p.t === 'braise') { cx.globalAlpha = a * 0.3; cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.s * 1.8, 0, 7); cx.fill(); }
          cx.globalCompositeOperation = 'source-over';
        }
      }
      cx.globalAlpha = 1;
    }
    if (!VIDEO) requestAnimationFrame(boucle);
    function explosion(x, y) {
      for (let k = 0; k < 170; k++) {
        const a = Math.random() * Math.PI * 2, v = Math.pow(Math.random(), 0.6) * 17 + 3;
        parts.push({ t: 'etincelle', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, drag: 0.952, g: 0.14, vie: 0, max: hasard(55, 110), s: hasard(1.8, 4.2), tr: 2.4, c: choix(COUL) });
      }
    }
    function confettis(x, y, n, haut) {
      for (let k = 0; k < n; k++) {
        parts.push(haut
          ? { t: 'confetti', x: hasard(0, W), y: hasard(-60, -10), vx: hasard(-1.5, 1.5), vy: hasard(2, 5), drag: 0.99, g: 0.05, vie: 0, max: hasard(220, 300), s: hasard(9, 15), rot: hasard(0, 6), vr: hasard(-0.2, 0.2), fl: hasard(0.08, 0.25), c: choix(CONF) }
          : { t: 'confetti', x, y, vx: hasard(-9, 9), vy: hasard(-17, -6), drag: 0.975, g: 0.32, vie: 0, max: hasard(150, 220), s: hasard(9, 16), rot: hasard(0, 6), vr: hasard(-0.3, 0.3), fl: hasard(0.08, 0.3), c: choix(CONF) });
      }
    }

    /* ---------- petits outils d'animation ---------- */
    const centre = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
    function replier(el, d) {
      const h = el.offsetHeight;
      return el.animate([{ height: h + 'px', opacity: 1, transform: 'scale(1)', marginTop: '0px' }, { height: '0px', opacity: 0, transform: 'scale(.6)', marginTop: '-12px' }],
        { duration: d || 360, easing: 'cubic-bezier(.5,0,.2,1)', fill: 'forwards' }).finished.then(() => el.remove());
    }
    function secousse(el, duree, ampli, croissant) {
      const k = [];
      for (let i = 0; i <= 24; i++) {
        const f = croissant ? i / 24 : 1 - i / 24, a = ampli * f * (i === 24 ? 0 : 1);
        k.push({ transform: `translate(${hasard(-a, a).toFixed(1)}px, ${(hasard(-a, a) - (croissant ? 8 * i / 24 : 0)).toFixed(1)}px) rotate(${hasard(-a / 3, a / 3).toFixed(2)}deg) scale(${croissant ? 1 + 0.06 * i / 24 : 1})` });
      }
      return el.animate(k, { duration: duree, fill: croissant ? 'forwards' : 'none' });
    }
    function decoder(el, final, duree) {
      const signes = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&@$?!';
      const t0 = maintenant();
      return new Promise((ok) => (function f() {
        const k = Math.min(1, (maintenant() - t0) / duree), n = Math.floor(k * final.length);
        el.textContent = final.split('').map((c, i) => (i < n || c === ' ' ? c : signes[Math.random() * signes.length | 0])).join('');
        if (k < 1) ensuite(f); else { el.textContent = final; ok(); }
      })());
    }

    /* ---------- le déblocage ---------- */
    let fait = false;
    async function debloquer(e) {
      if (fait) return; fait = true;
      deb.classList.remove('survol');
      // 1. appui sur le bouton + onde
      const rb = deb.getBoundingClientRect(), o = document.createElement('span');
      o.className = 'onde-btn'; o.style.left = ((e && e.clientX) ? e.clientX - rb.left : rb.width / 2) + 'px'; o.style.top = ((e && e.clientY) ? e.clientY - rb.top : rb.height / 2) + 'px';
      deb.appendChild(o);
      o.animate([{ transform: 'scale(.2)', opacity: 1 }, { transform: 'scale(16)', opacity: 0 }], { duration: 600, easing: 'ease-out', fill: 'forwards' });
      deb.animate([{ transform: 'scale(1)' }, { transform: 'scale(.92)', offset: 0.35 }, { transform: 'scale(1.03)' }], { duration: 240, easing: 'ease-out' });
      await dormir(220);
      replier(deb, 380);

      // 2. charge : la carte se soulève et tremble, le cadenas grossit, l'énergie est aspirée vers lui
      carte.classList.remove('pret');
      cadenas.style.animation = 'none';
      const voile = $('#voile');
      voile.animate([{ opacity: 0 }, { opacity: 0.7 }], { duration: 1000, easing: 'ease-in', fill: 'forwards' });
      $('#halo').animate([{ opacity: 0.22, scale: 1 }, { opacity: 0.75, scale: 0.7 }], { duration: 1100, easing: 'ease-in', fill: 'forwards' });
      await dormir(120);
      cible = centre(cadenas); aspirer = true;
      const charge = secousse(carte, 1150, 5, true);
      cadenas.animate([{ scale: 1, boxShadow: '0 0 16px -4px #FF2A3D', background: 'rgba(0,0,0,.7)' },
        { scale: 1.45, boxShadow: '0 0 60px 14px #FF2A3D', background: 'rgba(120,0,20,.85)' }], { duration: 1150, easing: 'cubic-bezier(.6,0,.9,.6)', fill: 'forwards' });
      await dormir(1000);

      // 3. le cadenas s'ouvre…
      const anse = $('#anse');
      anse.style.transformBox = 'fill-box'; anse.style.transformOrigin = '0% 100%';
      anse.animate([{ transform: 'translateY(0) rotate(0)' }, { transform: 'translateY(-3px) rotate(-32deg)' }], { duration: 160, easing: 'cubic-bezier(.3,1.6,.5,1)', fill: 'forwards' });
      cadenas.animate([{ scale: 1.45 }, { scale: 1.7, filter: 'brightness(2)' }], { duration: 170, fill: 'forwards' });
      await dormir(170);

      // 4. … et vole en éclats
      aspirer = false;
      const c = centre(cadenas);
      cadenas.style.visibility = 'hidden';
      const couche = $('#couche');
      for (let k = 0; k < 14; k++) {
        const s = document.createElement('div'), t = hasard(12, 30), a = (k / 14) * Math.PI * 2 + hasard(-0.2, 0.2), v = hasard(140, 330);
        s.className = 'eclat'; s.style.width = t + 'px'; s.style.height = t * hasard(0.7, 1.3) + 'px'; s.style.left = c.x + 'px'; s.style.top = c.y + 'px';
        s.style.clipPath = `polygon(${hasard(0, 40)}% 0%, 100% ${hasard(10, 60)}%, ${hasard(40, 100)}% 100%, 0% ${hasard(30, 90)}%)`;
        couche.appendChild(s);
        s.animate([{ transform: 'translate(-50%,-50%) rotate(0) scale(1)', opacity: 1 },
          { transform: `translate(calc(-50% + ${Math.cos(a) * v * 0.75}px), calc(-50% + ${Math.sin(a) * v * 0.75}px)) rotate(${hasard(-260, 260)}deg) scale(.8)`, opacity: 1, offset: 0.55 },
          { transform: `translate(calc(-50% + ${Math.cos(a) * v}px), calc(-50% + ${Math.sin(a) * v + 90}px)) rotate(${hasard(-420, 420)}deg) scale(.3)`, opacity: 0 }],
          { duration: hasard(900, 1300), easing: 'cubic-bezier(.12,.75,.3,1)', fill: 'forwards' }).finished.then(() => s.remove());
      }
      for (const [d, ep, del] of [[750, 4, 0], [900, 2, 130]]) {
        const w = document.createElement('div'); w.className = 'd-onde'; w.style.left = c.x + 'px'; w.style.top = c.y + 'px'; w.style.borderWidth = ep + 'px';
        couche.appendChild(w);
        w.animate([{ transform: 'scale(.2)', opacity: 1 }, { transform: 'scale(9)', opacity: 0 }], { duration: d, delay: del, easing: 'cubic-bezier(.15,.7,.3,1)', fill: 'both' }).finished.then(() => w.remove());
      }
      $('#flash').animate([{ opacity: 0 }, { opacity: 1, offset: 0.12 }, { opacity: 0 }], { duration: 650, easing: 'ease-out' });
      $('#flashEcran').animate([{ opacity: 0 }, { opacity: 0.6, offset: 0.15 }, { opacity: 0 }], { duration: 600, easing: 'ease-out' });
      $('#scene').animate([0, 1, 2, 3, 4, 5, 6, 7, 8].map((i) => ({ transform: i === 8 ? 'none' : `translate(${hasard(-9, 9) * (1 - i / 8)}px, ${hasard(-9, 9) * (1 - i / 8)}px)` })), { duration: 380 });
      explosion(c.x, c.y);
      confettis(c.x, c.y, 90);
      voile.animate([{ opacity: 0.7 }, { opacity: 0 }], { duration: 700, easing: 'ease-out', fill: 'forwards' });

      // 5. révélation : la carte tourne sur elle-même, la silhouette prend ses couleurs, les rayons apparaissent
      charge.cancel();
      carte.classList.remove('verrouille');
      const scene = portrait.querySelector('.lsf-scene') || portrait.firstElementChild;
      if (scene) scene.animate([{ filter: 'brightness(0) drop-shadow(0 0 6px #FF2A3D)' }, { filter: 'brightness(0) drop-shadow(0 0 6px #FF2A3D)', offset: 0.25 }, { filter: 'brightness(1.9) drop-shadow(0 0 14px #FF9AA3)', offset: 0.6 }, { filter: 'brightness(1) drop-shadow(0 0 0 transparent)' }], { duration: 1200, easing: 'ease-out' });
      carte.animate([{ transform: 'translateY(-8px) rotateY(0deg) scale(1.06)' }, { transform: 'translateY(-14px) rotateY(360deg) scale(1.14)', offset: 0.62 }, { transform: 'translateY(0) rotateY(360deg) scale(1)' }],
        { duration: 1400, easing: 'cubic-bezier(.3,.85,.35,1)' });
      $('#rayons').animate([{ opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1 }], { duration: 900, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'forwards' });
      $('#halo').animate([{ opacity: 0.75, scale: 0.7 }, { opacity: 0.95, scale: 1.15 }, { opacity: 0.6, scale: 1 }], { duration: 1400, easing: 'ease-out', fill: 'forwards' });
      dormir(650).then(() => $('#reflet').classList.add('go'));
      replier($('#xp'), 360); replier($('#jauge'), 360);

      // 6. le nom se décode, le badge rebondit
      await dormir(450);
      const nom = $('#nom');
      nom.animate([{ transform: 'scale(.8)', opacity: 0.4 }, { transform: 'scale(1.18)', opacity: 1, offset: 0.7 }, { transform: 'scale(1)', opacity: 1 }], { duration: 900, easing: 'ease-out' });
      decoder(nom, P.nom, 800);
      $('#badge').animate([{ transform: 'scale(1) rotate(0)' }, { transform: 'scale(1.55) rotate(-10deg)', offset: 0.4 }, { transform: 'scale(.92) rotate(4deg)', offset: 0.7 }, { transform: 'scale(1) rotate(0)' }], { duration: 700, delay: 250, easing: 'ease-out' });

      // 7. titre « Débloqué ! » lettre par lettre + pluie de confettis
      await dormir(380);
      const sur = $('#sur');
      sur.animate([{ opacity: 0.8 }, { opacity: 0 }], { duration: 200, fill: 'forwards' }).finished.then(() => {
        sur.textContent = 'Nouveau personnage secret';
        sur.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 400, easing: 'ease-out', fill: 'forwards' });
      });
      const titre = $('#titre');
      titre.innerHTML = 'Débloqué !'.split('').map((l) => (l === ' ' ? '<span class="esp"> </span>' : `<span>${l}</span>`)).join('');
      [...titre.children].forEach((s, i) => s.animate([{ opacity: 0, transform: 'translateY(40px) scale(.4) rotate(-12deg)', filter: 'blur(6px) drop-shadow(0 0 18px rgba(255,50,70,.75))' },
        { opacity: 1, transform: 'translateY(-8px) scale(1.12) rotate(3deg)', offset: 0.65, filter: 'blur(0) drop-shadow(0 0 18px rgba(255,50,70,.75))' },
        { opacity: 1, transform: 'none', filter: 'blur(0) drop-shadow(0 0 18px rgba(255,50,70,.75))' }], { duration: 650, delay: i * 55, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'both' }));
      confettis(0, 0, 110, true);

      // 8. bouton « Choisir » + la carte flotte, braises qui montent
      await dormir(420);
      const ch = document.createElement('span');
      ch.className = 'btn-choisir';
      ch.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Choisir';
      carte.insertBefore(ch, $('#badge'));
      ch.animate([{ opacity: 0, transform: 'scale(.4) translateY(14px)' }, { opacity: 1, transform: 'scale(1.08)', offset: 0.65 }, { opacity: 1, transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.2,.9,.3,1.2)' });
      await dormir(250);
      $('#flotte').classList.add('vole');
      braises = true;
    }
    deb.addEventListener('click', debloquer);

    /* ---------- mode vidéo : un faux curseur arrive, survole et clique ---------- */
    async function lancerDemo() {
      await dormir(500);
      const cur = $('#curseur');
      const b = centre(deb);
      const a = { x: W * 0.86, y: H * 0.98 }, k = { x: W * 0.98, y: H * 0.62 };
      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const pts = [];
      for (let i = 0; i <= 30; i++) {
        const t = ease(i / 30), u = 1 - t;
        pts.push({ transform: `translate(${u * u * a.x + 2 * u * t * k.x + t * t * b.x}px, ${u * u * a.y + 2 * u * t * k.y + t * t * b.y}px)`, opacity: Math.min(1, i / 6) });
      }
      await cur.animate(pts, { duration: 1400, fill: 'forwards' }).finished;
      deb.classList.add('survol');
      await dormir(380);
      cur.animate([{ scale: '1' }, { scale: '.82' }, { scale: '1' }], { duration: 220, transformOrigin: '0 0' });
      const ring = document.createElement('div'); ring.className = 'clic'; ring.style.left = b.x + 'px'; ring.style.top = b.y + 'px'; document.body.appendChild(ring);
      ring.animate([{ transform: 'scale(.3)', opacity: 1 }, { transform: 'scale(1.6)', opacity: 0 }], { duration: 450, easing: 'ease-out', fill: 'forwards' }).finished.then(() => ring.remove());
      debloquer({ clientX: b.x, clientY: b.y });
      await dormir(500);
      cur.animate([{ transform: `translate(${b.x}px, ${b.y}px)`, opacity: 1 }, { transform: `translate(${b.x + 150}px, ${b.y + 260}px)`, opacity: 0 }], { duration: 900, easing: 'ease-in', fill: 'forwards' });
    }
    window.lancerDemo = lancerDemo;
    // un pas d'horloge (mode vidéo) : réveille les minuteurs échus, laisse le code suivre, puis place chaque animation à l'instant exact
    const tick = () => new Promise((r) => setTimeout(r, 0));
    window.__pas = async (dt) => {
      vt += dt;
      for (let tour = 0; tour < 30; tour++) {
        minuteurs.sort((a, b) => a.at - b.at);
        const prets = [];
        while (minuteurs.length && minuteurs[0].at <= vt) prets.push(minuteurs.shift());
        if (!prets.length) break;
        prets.forEach((m) => m.r());
        await tick();
      }
      await tick();
      for (const a of document.getAnimations()) {
        if (a.__fini) continue;
        if (a.__t0 === undefined) a.__t0 = vt - (a.currentTime || 0);
        a.pause();
        const t = vt - a.__t0, fin = a.effect ? a.effect.getComputedTiming().endTime : Infinity;
        if (t >= fin) { a.__fini = true; a.finish(); } else a.currentTime = t;
      }
      await tick();
      avancer(true);
      return vt;
    };
    window.demoPrete = true;
  })();
  </script>
